<!DOCTYPE html>
<html>
<head>
    <title>Docker CI Pipeline</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf4ff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 450px;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        h1 {
            color: #0066cc;
            margin-bottom: 15px;
        }

        p {
            color: #444;
            font-size: 17px;
        }

        .status {
            margin-top: 25px;
            padding: 12px;
            background: #e0f7e9;
            color: #16803c;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Docker CI Pipeline</h1>

        <p>Application successfully deployed using Docker.</p>

        <p>Continuous Integration is working successfully.</p>

        <div class="status">
            Build Successful
        </div>
    </div>

</body>
</html>
